# =====================================================
# APPLICATION
# =====================================================

spring.application.name=taskflow

# =====================================================
# SERVER
# =====================================================

server.port=8080

# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/taskflow_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# JWT
# =====================================================

jwt.secret=YOUR_LONG_RANDOM_SECRET_KEY_CHANGE_THIS
jwt.expiration=86400000

# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework.security=INFO
logging.level.com.taskflow=INFO

# =====================================================
# SWAGGER / OPENAPI
# =====================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha